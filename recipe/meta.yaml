{% set name = "mbdata" %}
{% set version = "31.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  #url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/mbdata-{{ version }}.tar.gz
  url: https://github.com/acoustid/mbdata/archive/v{{ version }}.tar.gz
  sha256: f469372dd8bbb45d2371d9216b0e188c1343d613f45ad89f2f9ee7b28890799b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - poetry-core
    - poetry-dynamic-versioning >=1.0.0,<2.0.0
  run:
    - python >={{ python_min }},<4.0
    - six >=1.16.0,<2.0.0
  run_constrained:
    - SQLAlchemy >=1.4.29,<2.0.0
    - lxml >=4.9.1,<5.0.0

test:
  imports:
    - mbdata
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/acoustid/mbdata
  summary: MusicBrainz Database Tools
  license: MIT
  license_file: LICENSE
  dev_url: https://github.com/acoustid/mbdata
  description: To use mbslave, install the package with the same name

extra:
  recipe-maintainers:
    - HeavyTony2
