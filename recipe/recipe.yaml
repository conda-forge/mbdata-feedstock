schema_version: 1

context:
  name: mbdata
  version: "31.0.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  #url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/mbdata-{{ version }}.tar.gz
  url: https://github.com/acoustid/mbdata/archive/v${{ version }}.tar.gz
  sha256: 6477a8f119285e23d90903555d7d4c5f77a10e5f038bd646e3b15a7db8f3de8d

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - poetry-core
    - poetry-dynamic-versioning >=1.0.0,<2.0.0
  run:
    - python >=${{ python_min }},<4.0
    - six >=1.16.0,<2.0.0
  run_constraints:
    - SQLAlchemy >=1.4.29,<2.0.0
    - lxml >=4.9.1,<5.0.0

tests:
  - python:
      imports:
        - mbdata
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: MusicBrainz Database Tools
  license: MIT
  license_file: LICENSE
  description: To use mbslave, install the package with the same name
  homepage: https://github.com/acoustid/mbdata
  repository: https://github.com/acoustid/mbdata

extra:
  recipe-maintainers:
    - HeavyTony2
